<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luna Wallet" />
    <meta name="description" content="Luna Wallet — crypto wallet on TON Blockchain" />
    <meta name="author" content="Klikopolic Co." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Luna Wallet</title>
    <style>
      body { background: #000; color: #fff; margin: 0; font-family: -apple-system, sans-serif; }
      #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s; }
      #splash svg { width: 48px; height: 48px; }
      #splash p { margin-top: 16px; font-size: 18px; font-weight: 600; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner { margin-top: 20px; width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #007aff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      <p>Luna Wallet</p>
      <div class="spinner"></div>
      <script>window.addEventListener('load', () => { setTimeout(() => { const s = document.getElementById('splash'); if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 300); } }, 800); });</script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
