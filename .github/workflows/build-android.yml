name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true
      
      - name: Install deps & build web
        run: |
          npm ci || npm install
          npm run build
      
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin conflicts
        run: |
          # Exclude old kotlin-stdlib-jdk7/jdk8
          cd android
          cat >> app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
      
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaBank-v1.3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "Luna Bank v1.3.0"
          body: |
            🌙 Luna Bank v1.3.0 — Crypto Banking Ecosystem
            📱 Install APK on Android
            🌐 Web: https://luna-bank-app.vercel.app
